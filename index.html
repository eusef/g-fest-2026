<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>G-FEST 2026 Pocket Schedule</title>
  <meta name="description" content="Offline schedule for G-FEST 2026 — now, next, full 3-day, and your starred picks.">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#07090C">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="G-FEST">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preload" href="fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="app-header">
    <div class="app-header__row">
      <h1 class="app-header__title">G-FEST 2026</h1>
      <div class="app-header__actions">
        <button id="install-btn" class="install-btn" type="button" hidden aria-label="Install G-FEST app for offline use" title="Install this app for offline use">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="M8 10.5l4 4 4-4"/><path d="M5 20h14"/></svg>
          <span class="install-btn__label">Install</span>
        </button>
        <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh schedule" title="Refresh schedule">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5A8 8 0 1 0 18 17"/><path d="M20 5v5h-5"/></svg>
        </button>
      </div>
    </div>
    <div class="app-header__meta">
      <span id="clock" class="app-header__clock"></span>
      <span id="data-as-of" class="app-header__asof"></span>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Primary">
    <a class="tabbar__tab" href="#/now" data-route="#/now">
      <span class="tabbar__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.4V12l3.4 2"/></svg>
      </span>
      <span class="tabbar__label">Now</span>
    </a>
    <a class="tabbar__tab" href="#/browse" data-route="#/browse">
      <span class="tabbar__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="3" rx="1.5"/><rect x="3" y="10.5" width="18" height="3" rx="1.5"/><rect x="3" y="16" width="11" height="3" rx="1.5"/></svg>
      </span>
      <span class="tabbar__label">Browse</span>
    </a>
    <a class="tabbar__tab" href="#/my" data-route="#/my">
      <span class="tabbar__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 4l2.47 5.01 5.53.8-4 3.9.94 5.5L12 16.9 7.06 19.2 8 13.7l-4-3.9 5.53-.8z"/></svg>
      </span>
      <span class="tabbar__label">My Schedule</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/now.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
